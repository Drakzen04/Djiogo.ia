<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Djiogo.IA</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body{
  margin:0;height:100vh;background:linear-gradient(135deg,#020617,#0f172a);
  display:flex;justify-content:center;align-items:center;font-family:Segoe UI
}
.chat{
  width:100%;max-width:600px;height:95vh;
  backdrop-filter:blur(20px);
  background:rgba(30,30,30,.6);
  border-radius:20px;
  display:flex;flex-direction:column;
  box-shadow:0 0 40px #0ff
}
header{
  padding:15px;color:#38bdf8;font-weight:bold;
  border-bottom:1px solid rgba(255,255,255,.1)
}
.messages{flex:1;overflow-y:auto;padding:10px}
.msg{margin:6px 0;padding:12px;border-radius:15px;max-width:80%}
.user{background:#2563eb;color:white;margin-left:auto}
.bot{background:#111;color:#e5e7eb;box-shadow:0 0 10px #0ff}
.suggestions{
  display:flex;gap:6px;flex-wrap:wrap;padding:10px
}
.suggestions button{
  background:#0f172a;border:1px solid #38bdf8;
  color:#38bdf8;border-radius:20px;
  padding:6px 12px;cursor:pointer
}
.input{
  display:flex;padding:10px;border-top:1px solid rgba(255,255,255,.1)
}
input{flex:1;padding:12px;border:none;border-radius:10px;background:#111;color:white}
button{margin-left:6px;border:none;border-radius:10px;background:#38bdf8;color:white;padding:12px}
</style>
</head>
<body>

<div class="chat">
<header>🤖 Djiogo.IA</header>

<div class="messages" id="messages"></div>

<div class="suggestions">
<button onclick="suggest('Qui est ton créateur ?')">Créateur</button>
<button onclick="suggest('Aide-moi à créer une app')">Créer une app</button>
<button onclick="suggest('Explique-moi JavaScript')">JavaScript</button>
<button onclick="suggest('Donne une idée de startup')">Startup</button>
</div>

<div class="input">
<input id="input" placeholder="Pose ta question…">
<button onclick="send()">Envoyer</button>
</div>
</div>

<script>
const messages=document.getElementById("messages");
const input=document.getElementById("input");

function add(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.textContent=text;
  messages.appendChild(d);
  messages.scrollTop=messages.scrollHeight;
}

function suggest(t){
  input.value=t;
  send();
}

async function send(){
  const text=input.value.trim();
  if(!text)return;
  add(text,"user");
  input.value="";
  add("Djiogo.IA réfléchit…","bot");

  const res=await fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({question:text})
  });
  const data=await res.json();
  messages.lastChild.textContent=data.reponse;
}
</script>
</body>
</html>
